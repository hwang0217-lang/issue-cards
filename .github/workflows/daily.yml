name: daily-news-cardnews

on:
  schedule:
    # 한국시간 매일 오전 8시 = UTC 전날 23시
    - cron: "0 23 * * *"
    # 한국시간 매일 저녁 6시 = UTC 오전 9시
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 글/이미지만 만들고 업로드는 안 해요"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news-cardnews
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 뉴스 고르고 카드뉴스 올리기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          NEWS_PAUSED: ${{ vars.NEWS_PAUSED }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python main.py
      - name: 연습 실행 이미지 보관 (내려받아 확인용)
        if: ${{ github.event.inputs.dry_run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-preview
          path: images
          retention-days: 3
          if-no-files-found: ignore
      - name: 발행 기록 저장
        run: |
          git config user.name 'cardnews-bot'
          git config user.email 'cardnews-bot@users.noreply.github.com'
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet || (git commit -m 'update state' && git push)
          fi

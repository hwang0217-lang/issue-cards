name: refresh-instagram-token

on:
  schedule:
    # 매주 일요일 새벽 3시 37분(한국시간) = UTC 토요일 18시 37분
    - cron: "37 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install requests pynacl
      - name: 토큰 갱신하고 비밀 저장칸에 저장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SECRET_WRITER_TOKEN: ${{ secrets.IG_SECRET_WRITER_TOKEN }}
        run: |
          python cloud/refresh_instagram.py

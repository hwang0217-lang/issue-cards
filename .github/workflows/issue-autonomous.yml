name: Issue PC-off production
run-name: Issue autonomous ${{ inputs.mode || 'operate' }}
on:
  schedule:
    - cron: '55 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, research-check, transport-check, editorial-preview, preview, operate]
        default: preflight
      format:
        type: choice
        options: [carousel, motion_reel]
        default: carousel
permissions:
  contents: write
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow imageio-ffmpeg beautifulsoup4
      - run: python cloud/issue_preflight.py
        if: inputs.mode == 'preflight'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
      - run: python cloud/news_check.py
        if: inputs.mode == 'research-check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python cloud/issue_autonomous.py
        if: github.event_name == 'schedule' || inputs.mode == 'preview' || inputs.mode == 'operate'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          ISSUE_APPROVED_MUSIC: ${{ secrets.ISSUE_APPROVED_MUSIC }}
          ISSUE_MEDIA_UPLOAD_KEY: ${{ secrets.ISSUE_MEDIA_UPLOAD_KEY }}
          ISSUE_MEDIA_BASE: ${{ vars.ISSUE_MEDIA_BASE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          ISSUE_AUTONOMOUS_ACTIVE: ${{ vars.ISSUE_AUTONOMOUS_ACTIVE || '0' }}
          ISSUE_MODE: ${{ inputs.mode || 'operate' }}
          ISSUE_PREVIEW_FORMAT: ${{ inputs.format || 'carousel' }}
      - name: Verified real-photo editorial preview only
        if: inputs.mode == 'editorial-preview'
        run: python cloud/issue_editorial_preview.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ISSUE_MODE: editorial-preview
      - run: python cloud/issue_transport_check.py
        if: inputs.mode == 'transport-check'
        env:
          ISSUE_APPROVED_MUSIC: ${{ secrets.ISSUE_APPROVED_MUSIC }}
          ISSUE_MEDIA_UPLOAD_KEY: ${{ secrets.ISSUE_MEDIA_UPLOAD_KEY }}
          ISSUE_MEDIA_BASE: ${{ vars.ISSUE_MEDIA_BASE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-autonomous-report
          path: |
            cloud-reports/*.json
            cloud-reports/page-*.png
            cloud-reports/scene-*.png
          retention-days: 7
